
server:
  port: 5004

spring:
  application:
    name: job-portal-resume-service

  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job-portal-resume}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Alinogy7}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
